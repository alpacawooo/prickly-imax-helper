name: Cross-platform tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked runtime and test tools
        run: python -m pip install --disable-pip-version-check . ruff==0.14.2
      - name: Lint
        run: ruff check runtime tests scripts plugins/prickly-imax-helper
      - name: Compile
        run: python -m compileall -q runtime tests scripts plugins/prickly-imax-helper
      - name: Test
        env:
          PYTHONPATH: runtime
        run: python -m unittest discover -s tests -v
