name: Cross-platform tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked runtime and test tools
        run: python -m pip install --disable-pip-version-check . ruff==0.14.2
      - name: Lint
        run: ruff check runtime tests scripts plugins/prickly-imax-helper
      - name: Compile
        run: python -m compileall -q runtime tests scripts plugins/prickly-imax-helper
      - name: Parse macOS service scripts
        if: runner.os == 'macOS'
        run: zsh -n scripts/Install.command scripts/Update.command scripts/Uninstall.command
      - name: Parse Windows service scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $failed = $false
          foreach ($script in Get-ChildItem scripts\*.ps1) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count) {
              $parseErrors | ForEach-Object { Write-Error "$($script.Name): $_" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Test
        env:
          PYTHONPATH: runtime
        run: python -m unittest discover -s tests -v
      - name: Smoke-test macOS installer
        if: runner.os == 'macOS'
        run: |
          export PRICKLY_IMAX_HOME="$HOME/.prickly-ci"
          export PRICKLY_INSTALL_DRY_RUN=1
          zsh scripts/Install.command
          "$PRICKLY_IMAX_HOME/venv/bin/prickly-imax" --home "$PRICKLY_IMAX_HOME" doctor
          zsh scripts/Update.command
          "$PRICKLY_IMAX_HOME/venv/bin/prickly-imax" --home "$PRICKLY_IMAX_HOME" doctor
          export PRICKLY_UNINSTALL_KEEP_DATA=1
          zsh scripts/Uninstall.command
          test ! -e "$PRICKLY_IMAX_HOME/app"
          test ! -e "$PRICKLY_IMAX_HOME/venv"
          test -d "$PRICKLY_IMAX_HOME"
      - name: Smoke-test Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:PRICKLY_IMAX_HOME = Join-Path $env:USERPROFILE 'AppData\Local\PricklyCI'
          $env:PRICKLY_INSTALL_DRY_RUN = '1'
          & scripts\Install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:PRICKLY_IMAX_HOME\bin\prickly-imax.cmd" --home $env:PRICKLY_IMAX_HOME doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & scripts\Update.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:PRICKLY_IMAX_HOME\bin\prickly-imax.cmd" --home $env:PRICKLY_IMAX_HOME doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PRICKLY_UNINSTALL_KEEP_DATA = '1'
          & scripts\Uninstall.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path "$env:PRICKLY_IMAX_HOME\app") { throw 'app directory survived uninstall' }
          if (Test-Path "$env:PRICKLY_IMAX_HOME\venv") { throw 'venv directory survived uninstall' }
          if (-not (Test-Path "$env:PRICKLY_IMAX_HOME")) { throw 'preserved data root was removed' }
