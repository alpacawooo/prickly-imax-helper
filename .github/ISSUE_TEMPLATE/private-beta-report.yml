name: 비공개 베타 오류 신고
description: CGV·결제 개인정보 없이 설치 또는 실행 문제를 신고합니다.
title: "[베타] "
labels: ["private-beta"]
body:
  - type: markdown
    attributes:
      value: |
        CGV 계정 정보, 관람권 번호, 쿠키, 카드정보, 이메일 주소가 포함된 화면은 첨부하지 마세요. 개인정보가 제거된 `prickly-imax diagnose` 결과만 붙여넣으세요.
  - type: dropdown
    id: platform
    attributes:
      label: 운영체제
      options:
        - macOS
        - Windows 10
        - Windows 11
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 실패 단계
      options:
        - 다운로드 또는 체크섬
        - 설치
        - 전용 Chrome 또는 로그인
        - 테스트메일
        - 무클릭 dry-run
        - 감시 상태
        - 중지
        - 업데이트
        - 삭제
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 화면에 표시된 짧은 오류 문구
      description: 붙여넣기 전에 개인정보를 제거하세요.
    validations:
      required: true
  - type: dropdown
    id: shared_ip
    attributes:
      label: 같은 공인 IP에서 다른 Helper가 실행 중이었나요?
      options:
        - "아니요"
        - "예"
        - 모름
    validations:
      required: true
  - type: textarea
    id: diagnose
    attributes:
      label: 개인정보가 제거된 diagnose JSON
      description: "`prickly-imax diagnose` 출력만 붙여넣으세요."
      render: json
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 개인정보 제거 확인
      options:
        - label: 비밀번호, 이메일 주소, 고객번호, 관람권 번호, 쿠키, 결제정보를 모두 제거했습니다.
          required: true
