name: Private beta report
description: Report an installation or runtime problem without private CGV or payment data.
title: "[beta] "
labels: ["private-beta"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach screenshots containing CGV account details, voucher numbers, cookies, card data, or email addresses. Paste only the redacted `prickly-imax diagnose` output.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows 10
        - Windows 11
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Failed stage
      options:
        - Download or checksum
        - Install
        - Dedicated Chrome or login
        - Test email
        - Dry-run
        - Monitor status
        - Stop
        - Update
        - Uninstall
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Short visible error
      description: Remove personal data before pasting.
    validations:
      required: true
  - type: dropdown
    id: shared_ip
    attributes:
      label: Was another Helper running on the same public IP?
      options:
        - "No"
        - "Yes"
        - Unknown
    validations:
      required: true
  - type: textarea
    id: diagnose
    attributes:
      label: Redacted diagnose JSON
      description: Paste only the output from `prickly-imax diagnose`.
      render: json
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed passwords, email addresses, customer IDs, voucher numbers, cookies, and payment data.
          required: true
