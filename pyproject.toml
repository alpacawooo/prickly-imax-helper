[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prickly-imax-helper"
version = "0.1.0"
description = "Local-first CGV IMAX monitoring runtime"
requires-python = ">=3.10"
dependencies = [
  "playwright==1.62.0",
  "greenlet==3.5.4",
  "pyee==13.0.1",
  "tzdata==2025.3",
  "typing_extensions==4.16.0"
]

[project.scripts]
prickly-imax = "prickly_imax_helper.cli:main"

[tool.setuptools.packages.find]
where = ["runtime"]
